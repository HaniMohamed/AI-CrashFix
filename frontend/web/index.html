<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flutter web UI for the AI Crash Fix pipeline.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI Crash Fix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>AI Crash Fix</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background-color: #0A0E1A; }
    .loader-shell {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at top, #1a1f3a 0%, #0A0E1A 60%);
      color: #E5E7EB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    .loader-shell .ring {
      width: 56px; height: 56px; border-radius: 50%;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #8B5CF6;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-shell .label {
      position: absolute; top: calc(50% + 56px); width: 100%; text-align: center;
      letter-spacing: 0.18em; font-size: 12px; color: #94A3B8;
    }
  </style>
</head>
<body>
  <div id="boot-shell" class="loader-shell">
    <div class="ring"></div>
    <div class="label">AI CRASH FIX</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-shell');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
