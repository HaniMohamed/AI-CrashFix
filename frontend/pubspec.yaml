name: ai_crash_fix_ui
description: Flutter web UI for the AI Crash Fix pipeline.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # http + streaming
  http: ^1.2.2
  fetch_client: ^1.1.2

  # ui
  fl_chart: ^0.69.2
  google_fonts: ^6.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  animated_flip_counter: ^0.3.4

  # utils
  intl: ^0.20.2
  file_picker: ^8.1.4
  web: ^1.1.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
