<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" aria-label="">
  <!-- Minimal installer chrome: flat panel + drag hint arrow only (no branding artwork). -->
  <rect width="680" height="320" rx="12" fill="#EBEBEB"/>
